<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tap Game</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101010;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            width: min(92vw, 430px);
            text-align: center;
        }

        .top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .stat {
            background: #1c1c1c;
            padding: 12px 18px;
            border-radius: 14px;
            min-width: 100px;
        }

        .label {
            color: #777;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .value {
            font-size: 24px;
            font-weight: bold;
        }

        #arena {
            position: relative;
            width: 100%;
            height: 500px;
            background: #181818;
            border-radius: 24px;
            overflow: hidden;
        }

        #target {
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            background: white;
            cursor: pointer;
            display: none;
            transform: translate(-50%, -50%);
            transition: transform 0.08s;
        }

        #target:active {
            transform: translate(-50%, -50%) scale(0.85);
        }

        #start {
            margin-top: 20px;
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 16px;
            background: white;
            color: black;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="game">

    <div class="top">

        <div class="stat">
            <div class="label">SCORE</div>
            <div class="value" id="score">0</div>
        </div>

        <div class="stat">
            <div class="label">TIME</div>
            <div class="value" id="time">10</div>
        </div>

    </div>


    <div id="arena">

        <div id="message">
            TAP START
        </div>

        <button id="target"></button>

    </div>


    <button id="start">
        START GAME
    </button>

</div>


<script>

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}


const arena = document.getElementById("arena");
const target = document.getElementById("target");
const startButton = document.getElementById("start");
const message = document.getElementById("message");

const scoreElement = document.getElementById("score");
const timeElement = document.getElementById("time");


let score = 0;
let timeLeft = 10;
let timer = null;
let playing = false;


function moveTarget() {

    const padding = 45;

    const x =
        padding +
        Math.random() *
        (arena.clientWidth - padding * 2);

    const y =
        padding +
        Math.random() *
        (arena.clientHeight - padding * 2);

    target.style.left = `${x}px`;
    target.style.top = `${y}px`;

}


function startGame() {

    if (playing) return;

    playing = true;

    score = 0;
    timeLeft = 10;

    scoreElement.textContent = score;
    timeElement.textContent = timeLeft;

    message.style.display = "none";
    target.style.display = "block";

    startButton.disabled = true;
    startButton.textContent = "PLAYING...";

    moveTarget();

    timer = setInterval(() => {

        timeLeft--;

        timeElement.textContent = timeLeft;

        if (timeLeft <= 0) {

            endGame();

        }

    }, 1000);

}


function endGame() {

    clearInterval(timer);

    playing = false;

    target.style.display = "none";

    message.textContent =
        `GAME OVER — ${score} POINTS`;

    message.style.display = "flex";

    startButton.disabled = false;
    startButton.textContent = "PLAY AGAIN";

}


target.addEventListener("click", () => {

    if (!playing) return;

    score++;

    scoreElement.textContent = score;

    moveTarget();

});


startButton.addEventListener("click", startGame);


</script>

</body>

</html>
