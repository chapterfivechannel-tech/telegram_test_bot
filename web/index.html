<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Telegram User Test</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 420px;
            padding: 30px;
            background: #1d1d1d;
            border-radius: 20px;
        }

        h1 {
            margin-top: 0;
        }

        .row {
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }

        .label {
            color: #888;
            font-size: 13px;
        }

        .value {
            margin-top: 5px;
            font-size: 17px;
            word-break: break-all;
        }

    </style>

</head>

<body>

<div class="box">

    <h1 id="title">Connecting...</h1>

    <div class="row">
        <div class="label">Backend</div>
        <div class="value" id="backend">
            Connecting...
        </div>
    </div>

    <div class="row">
        <div class="label">Name</div>
        <div class="value" id="name"></div>
    </div>

    <div class="row">
        <div class="label">Telegram ID</div>
        <div class="value" id="id"></div>
    </div>

    <div class="row">
        <div class="label">Username</div>
        <div class="value" id="username"></div>
    </div>

</div>


<script>

const tg = window.Telegram?.WebApp;

async function connectTelegram() {

    if (!tg) {

        document.getElementById("title").textContent =
            "Telegram WebApp NOT found";

        return;
    }

    tg.ready();
    tg.expand();

    const initData = tg.initData;

    if (!initData) {

        document.getElementById("title").textContent =
            "No Telegram data";

        document.getElementById("backend").textContent =
            "initData is empty";

        return;
    }

    try {

        const response = await fetch(
            "https://chapterfivechannel.pythonanywhere.com/telegram-auth",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    initData: initData
                })
            }
        );

        const result = await response.json();

        if (!result.ok) {

            throw new Error(
                result.error || "Authentication failed"
            );
        }

        const user = result.user;

        document.getElementById("title").textContent =
            `Hello, ${user.first_name}!`;

        document.getElementById("backend").textContent =
            "Telegram user verified by Python";

        document.getElementById("name").textContent =
            [
                user.first_name,
                user.last_name
            ]
            .filter(Boolean)
            .join(" ");

        document.getElementById("id").textContent =
            user.id;

        document.getElementById("username").textContent =
            user.username
                ? `@${user.username}`
                : "No username";

    } catch (error) {

        console.error(error);

        document.getElementById("title").textContent =
            "Connection failed";

        document.getElementById("backend").textContent =
            error.message;
    }
}


connectTelegram();

</script>

</body>

</html>
